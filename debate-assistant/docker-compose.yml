services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DB_PATH: /app/data/debates.db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-240s}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-2}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - debate-data:/app/data
volumes:
  debate-data:
